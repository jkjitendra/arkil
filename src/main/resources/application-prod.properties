# ============================================
# Arkil Server — Production Profile
# ============================================
# Activate with: SPRING_PROFILES_ACTIVE=prod
# or: java -jar arkil-server.jar --spring.profiles.active=prod

spring.application.name=arkil-server

# ============================================
# Database (PostgreSQL)
# ============================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/arkil}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true

# Initialize OAuth2 tables
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-oauth2.sql

# H2 Console — DISABLED in production
spring.h2.console.enabled=false

# ============================================
# Platform Admin Bootstrap
# ============================================
arkil.admin.bootstrap.username=${ARKIL_ADMIN_USERNAME:}
arkil.admin.bootstrap.password=${ARKIL_ADMIN_PASSWORD:}
arkil.admin.bootstrap.email=${ARKIL_ADMIN_EMAIL:}

# ============================================
# Security
# ============================================
# Session cookies
server.servlet.session.timeout=30m
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# SameSite for auth flow cookies
arkil.session.cookie.same-site=Lax
arkil.session.cookie.secure=true

# Encryption key — REQUIRED in production
# Generate with: openssl rand -base64 32
arkil.security.encryption-key=${ARKIL_ENCRYPTION_KEY}

# ============================================
# Rate Limiting
# ============================================
arkil.security.rate-limit.max-attempts=${ARKIL_SECURITY_RATE_LIMIT_MAX_ATTEMPTS:10}
arkil.security.rate-limit.window-seconds=${ARKIL_SECURITY_RATE_LIMIT_WINDOW_SECONDS:300}
arkil.ratelimit.backend=${ARKIL_RATELIMIT_BACKEND:redis}
arkil.ratelimit.redis.key-prefix=${ARKIL_RATELIMIT_REDIS_KEY_PREFIX:arkil:ratelimit}
arkil.ratelimit.ip.max=100
arkil.ratelimit.ip.window=60
arkil.ratelimit.email.max=5
arkil.ratelimit.email.window=300
arkil.ratelimit.project.max=1000
arkil.ratelimit.project.window=60
arkil.ratelimit.login.max=5
arkil.ratelimit.login.window=300

# ============================================
# Tokens
# ============================================
arkil.token.refresh.expiry-days=30
arkil.token.refresh.max-sessions=10
arkil.token.access.expiry-minutes=15
arkil.keys.rotation-grace-hours=24
arkil.project.deletion-retention-days=${ARKIL_PROJECT_DELETION_RETENTION_DAYS:7}
arkil.project.cleanup-cron=${ARKIL_PROJECT_CLEANUP_CRON:0 0 */6 * * *}

# ============================================
# Email
# ============================================
arkil.email.provider=${ARKIL_EMAIL_PROVIDER:smtp}
arkil.email.from=${ARKIL_EMAIL_FROM:noreply@arkil.io}
arkil.email.base-url=${ARKIL_BASE_URL:https://auth.arkil.io}
arkil.mfa.totp.issuer=${ARKIL_TOTP_ISSUER:Arkil}
arkil.webauthn.rp-name=${ARKIL_WEBAUTHN_RP_NAME:Arkil}
arkil.webauthn.rp-id=${ARKIL_WEBAUTHN_RP_ID:}
arkil.webauthn.origin=${ARKIL_WEBAUTHN_ORIGIN:}
arkil.webauthn.timeout-ms=${ARKIL_WEBAUTHN_TIMEOUT_MS:60000}

# SMTP config (when email.provider=smtp)
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ============================================
# OAuth Platform Providers (developer dashboard social login)
# ============================================
arkil.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
arkil.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
arkil.oauth.github.client-id=${GITHUB_CLIENT_ID:}
arkil.oauth.github.client-secret=${GITHUB_CLIENT_SECRET:}


# ============================================
# Logging — Production (WARN for less noise)
# ============================================
logging.level.root=WARN
logging.level.com.arkil=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ============================================
# OpenAPI / Swagger — DISABLED in production
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=false
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.enabled=false
springdoc.show-actuator=false

# ============================================
# Actuator — Limited in production
# ============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.redis.enabled=false

# ============================================
# Server
# ============================================
server.port=${PORT:8080}
