spring.application.name=arkil-server

# ============================================
# Database Configuration
# ============================================
spring.h2.console.enabled=true

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=pwd
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

# Initialize OAuth2 tables before JPA (required for JDBC-backed Authorization Server)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-oauth2.sql

#spring.datasource.url=jdbc:postgresql://localhost:5432/arkil
#spring.datasource.username=arkil
#spring.datasource.password=arkil
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=false
#spring.jpa.properties.hibernate.format_sql=true

# ============================================
# Platform Admin Bootstrap
# ============================================
# Set these on first run to create the initial admin.
# Clear the password after first startup for security.
arkil.admin.bootstrap.username=${ARKIL_ADMIN_USERNAME:admin}
arkil.admin.bootstrap.password=${ARKIL_ADMIN_PASSWORD:admin123}
arkil.admin.bootstrap.email=${ARKIL_ADMIN_EMAIL:admin@arkil.local}

# ============================================
# Rate Limiting
# ============================================
arkil.security.rate-limit.max-attempts=10
arkil.security.rate-limit.window-seconds=300
arkil.ratelimit.backend=memory
arkil.ratelimit.redis.key-prefix=${ARKIL_RATELIMIT_REDIS_KEY_PREFIX:arkil:ratelimit}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ============================================
# Logging
# ============================================
logging.level.com.arkil=DEBUG

# ============================================
# OpenAPI / Swagger UI
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.enabled=true
springdoc.show-actuator=false

# ============================================
# Security Settings
# ============================================
# Session timeout (for login flow)
server.servlet.session.timeout=30m

# Cookie security (enable in production)
# server.servlet.session.cookie.secure=true
# server.servlet.session.cookie.http-only=true
# server.servlet.session.cookie.same-site=strict

# ============================================
# Actuator
# ============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.health.redis.enabled=false

# ============================================
# Email
# ============================================
arkil.email.provider=console
arkil.email.from=noreply@arkil.io
arkil.email.base-url=http://localhost:8080
arkil.mfa.totp.issuer=${ARKIL_TOTP_ISSUER:Arkil}
arkil.webauthn.rp-name=${ARKIL_WEBAUTHN_RP_NAME:Arkil}
arkil.webauthn.rp-id=${ARKIL_WEBAUTHN_RP_ID:}
arkil.webauthn.origin=${ARKIL_WEBAUTHN_ORIGIN:}
arkil.webauthn.timeout-ms=${ARKIL_WEBAUTHN_TIMEOUT_MS:60000}

# ============================================
# Session Cookies (SameSite as deployment knob)
# ============================================
# SaaS mode (cross-site): None (requires Secure)
# Same-origin mode: Lax or Strict
arkil.session.cookie.same-site=None
arkil.session.cookie.secure=false

# ============================================
# Rate Limiting
# ============================================
# IP: 100 requests per 60 seconds
arkil.ratelimit.ip.max=100
arkil.ratelimit.ip.window=60
# Email: 5 requests per 5 minutes (password reset, etc.)
arkil.ratelimit.email.max=5
arkil.ratelimit.email.window=300
# Project: 1000 requests per 60 seconds
arkil.ratelimit.project.max=1000
arkil.ratelimit.project.window=60
# Login attempts: 5 per 5 minutes per account
arkil.ratelimit.login.max=5
arkil.ratelimit.login.window=300

# ============================================
# Refresh Tokens
# ============================================
arkil.token.refresh.expiry-days=30
arkil.token.refresh.max-sessions=10

# ============================================
# API Keys
# ============================================
arkil.keys.rotation-grace-hours=24
arkil.project.deletion-retention-days=${ARKIL_PROJECT_DELETION_RETENTION_DAYS:7}
arkil.project.cleanup-cron=${ARKIL_PROJECT_CLEANUP_CRON:0 0 */6 * * *}

# ============================================
# OAuth Platform Providers (for developer dashboard social login)
# ============================================
arkil.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
arkil.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
arkil.oauth.github.client-id=${GITHUB_CLIENT_ID:}
arkil.oauth.github.client-secret=${GITHUB_CLIENT_SECRET:}

# ============================================
# Secret Encryption (AES-256-GCM)
# ============================================
# Generate with: openssl rand -base64 32
arkil.security.encryption-key=${ARKIL_ENCRYPTION_KEY:}

# ============================================
# Access Token
# ============================================
arkil.token.access.expiry-minutes=15
