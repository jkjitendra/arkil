spring.application.name=arkil-server

# ============================================
# Database Configuration
# ============================================
spring.h2.console.enabled=true

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=pwd
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

#spring.datasource.url=jdbc:postgresql://localhost:5432/arkil
#spring.datasource.username=arkil
#spring.datasource.password=arkil
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=false
#spring.jpa.properties.hibernate.format_sql=true

# ============================================
# Platform Admin Bootstrap
# ============================================
# Set these on first run to create the initial admin.
# Clear the password after first startup for security.
arkil.admin.bootstrap.username=admin
arkil.admin.bootstrap.password=adnim
arkil.admin.bootstrap.email=admin@arkil.local

# ============================================
# Rate Limiting
# ============================================
arkil.security.rate-limit.max-attempts=10
arkil.security.rate-limit.window-seconds=300

# ============================================
# Logging
# ============================================
logging.level.com.arkil=DEBUG
