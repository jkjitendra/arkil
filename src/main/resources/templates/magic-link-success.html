<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arkil - Signed In</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .auth-container {
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 40px; width: 100%; max-width: 400px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
        .logo { margin-bottom: 24px; }
        .logo h1 { color: #fff; font-size: 2.5rem; font-weight: 700; letter-spacing: 2px; }
        .logo span { color: #e94560; }
        .success-icon { font-size: 3rem; margin-bottom: 16px; }
        .success-title { color: #6bffb0; font-size: 1.3rem; font-weight: 600; margin-bottom: 12px; }
        .success-text { color: rgba(255,255,255,0.7); font-size: 0.95rem; line-height: 1.5; }
        .powered { margin-top: 24px; color: rgba(255,255,255,0.3); font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo">
            <h1>Ark<span>il</span></h1>
        </div>

        <div class="success-icon">&#10003;</div>
        <p class="success-title">You're signed in!</p>
        <p class="success-text">
            Your magic link has been verified and you're now authenticated.
            You can close this tab or continue browsing.
        </p>

        <p class="powered">Powered by Arkil Auth Server</p>
    </div>
</body>
</html>
