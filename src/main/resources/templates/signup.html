<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arkil - Sign Up</title>
    <style th:replace="~{fragments/auth-styles :: styles}"></style>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .auth-container {
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 40px; width: 100%; max-width: 400px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1);
        }
        .logo { text-align: center; margin-bottom: 24px; }
        .logo h1 { color: #fff; font-size: 2.5rem; font-weight: 700; letter-spacing: 2px; }
        .logo span { color: #e94560; }
        .subtitle { text-align: center; color: rgba(255,255,255,0.7); margin-bottom: 24px; font-size: 0.95rem; }
        .client-badge {
            text-align: center; margin-bottom: 20px; padding: 8px 16px;
            background: rgba(233,69,96,0.2); border-radius: 20px;
            color: rgba(255,255,255,0.8); font-size: 0.85rem;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; color: rgba(255,255,255,0.8); margin-bottom: 8px; font-size: 0.9rem; }
        .form-group input {
            width: 100%; padding: 14px 18px; border: none; border-radius: 10px;
            background: rgba(255,255,255,0.1); color: #fff; font-size: 1rem; transition: all 0.3s ease;
        }
        .form-group input:focus { outline: none; background: rgba(255,255,255,0.2); box-shadow: 0 0 20px rgba(233,69,96,0.3); }
        .form-group input::placeholder { color: rgba(255,255,255,0.5); }
        .submit-btn {
            width: 100%; padding: 14px; border: none; border-radius: 10px;
            background: linear-gradient(135deg, #e94560, #0f3460);
            color: #fff; font-size: 1.05rem; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease; margin-top: 8px;
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(233,69,96,0.4); }
        .error-message {
            background: rgba(255,0,0,0.2); border: 1px solid rgba(255,0,0,0.3);
            border-radius: 10px; padding: 14px; margin-bottom: 18px; color: #ff6b6b; text-align: center;
        }
        .success-message {
            background: rgba(0,200,100,0.2); border: 1px solid rgba(0,200,100,0.3);
            border-radius: 10px; padding: 14px; margin-bottom: 18px; color: #6bffb0; text-align: center;
        }
        .footer-text {
            text-align: center; margin-top: 20px; color: rgba(255,255,255,0.5); font-size: 0.85rem;
        }
        .footer-text a { color: #e94560; text-decoration: none; }
        .footer-text a:hover { text-decoration: underline; }
        .powered { text-align: center; margin-top: 16px; color: rgba(255,255,255,0.3); font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo">
            <h1>Ark<span>il</span></h1>
        </div>
        <p class="subtitle">Create your account</p>

        <!-- Client badge -->
        <div th:if="${clientContext != null and clientContext.resolved}" class="client-badge">
            Signing up for: <strong th:text="${clientContext.clientId}">client</strong>
        </div>

        <!-- Error message -->
        <div th:if="${error}" class="error-message" th:text="${error}">Error</div>

        <!-- Success message -->
        <div th:if="${success}" class="success-message">
            Account created! A verification email has been sent to <strong th:text="${email}">email</strong>.
            <br/><br/>
            <a th:href="${clientContext != null and clientContext.resolved}
                ? @{/login(client_id=${clientContext.clientId})}
                : @{/login}"
               style="color: #6bffb0;">Sign in now</a>
        </div>

        <!-- Signup form (hidden after success) -->
        <div th:unless="${success}">
            <form th:action="@{/signup}" method="post">
                <input th:if="${clientContext != null and clientContext.resolved}"
                       type="hidden" name="client_id" th:value="${clientContext.clientId}"/>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                           th:value="${email}" placeholder="you@example.com" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           placeholder="At least 8 characters" required minlength="8">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword"
                           placeholder="Confirm your password" required>
                </div>

                <button type="submit" class="submit-btn">Create Account</button>
            </form>
        </div>

        <p class="footer-text">
            Already have an account?
            <a th:href="${clientContext != null and clientContext.resolved}
                ? @{/login(client_id=${clientContext.clientId})}
                : @{/login}">Sign in</a>
        </p>

        <p class="powered">Powered by Arkil Auth Server</p>
    </div>
</body>
</html>
