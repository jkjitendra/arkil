<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arkil - Email Verification</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .auth-container {
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 40px; width: 100%; max-width: 400px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
        .logo { margin-bottom: 24px; }
        .logo h1 { color: #fff; font-size: 2.5rem; font-weight: 700; letter-spacing: 2px; }
        .logo span { color: #e94560; }
        .icon { font-size: 3rem; margin-bottom: 16px; }
        .result-title { font-size: 1.3rem; font-weight: 600; margin-bottom: 12px; }
        .result-text { color: rgba(255,255,255,0.7); font-size: 0.95rem; line-height: 1.5; }
        .success .result-title { color: #6bffb0; }
        .error .result-title { color: #ff6b6b; }
        .footer-text {
            margin-top: 24px; color: rgba(255,255,255,0.5); font-size: 0.85rem;
        }
        .footer-text a { color: #e94560; text-decoration: none; }
        .footer-text a:hover { text-decoration: underline; }
        .powered { margin-top: 16px; color: rgba(255,255,255,0.3); font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo">
            <h1>Ark<span>il</span></h1>
        </div>

        <!-- Success -->
        <div th:if="${success}" class="success">
            <div class="icon">&#10003;</div>
            <p class="result-title">Email Verified!</p>
            <p class="result-text">
                Your email address has been verified successfully.
                You can now sign in to your account.
            </p>
        </div>

        <!-- Error -->
        <div th:if="${error}" class="error">
            <div class="icon">&#10007;</div>
            <p class="result-title">Verification Failed</p>
            <p class="result-text" th:text="${error}">Error message</p>
        </div>

        <p class="footer-text">
            <a th:href="@{/login}">Go to sign in</a>
        </p>

        <p class="powered">Powered by Arkil Auth Server</p>
    </div>
</body>
</html>
